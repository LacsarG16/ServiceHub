version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: servicehub-db
    restart: always
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: servicehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
